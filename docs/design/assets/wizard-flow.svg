<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .st { fill:#f6f8fa; stroke:#d0d7de; stroke-width:1.5; rx:10 }
      .sb { fill:#fff; stroke:#0969da; stroke-width:1.5; rx:8 }
      .sh { fill:#fff; stroke:#cf222e; stroke-width:2; rx:8 }
      .sg { fill:#fff; stroke:#1a7f37; stroke-width:2; rx:8 }
      .tt { font-size:13.5px; fill:#1f2328; text-anchor:middle }
      .ts { font-size:11px; fill:#57606a; text-anchor:middle }
      .th { font-size:12px; font-weight:bold; fill:#fff; text-anchor:middle }
      .human { font-size:11px; fill:#cf222e; text-anchor:middle; font-weight:bold }
      .auto  { font-size:11px; fill:#1a7f37; text-anchor:middle; font-weight:bold }
    </style>
  </defs>

  <!-- S1 -->
  <rect class="st" x="20" y="15" width="1060" height="55"/>
  <text class="tt" x="550" y="37">Wizard 开场</text>
  <text class="ts" x="550" y="56">问：你想达成什么？（人话，自由文本）+ 关联仓库/项目</text>

  <line x1="550" y1="70" x2="550" y2="95" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>

  <!-- S2 人 -->
  <rect class="sh" x="150" y="95" width="800" height="52" rx="8"/>
  <text class="tt" x="550" y="117">S2 人·澄清目标（human）</text>
  <text class="ts" x="550" y="136">wizard 追问：范围？交付物？给谁用？当前代码在哪？→ 产出 objective + context 草稿</text>

  <line x1="550" y1="147" x2="550" y2="172" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>

  <!-- S3 人 + 建议 -->
  <rect class="sh" x="150" y="172" width="800" height="52" rx="8"/>
  <text class="tt" x="550" y="194">S3 人·确认完成标准（human，wizard 建议）</text>
  <text class="ts" x="550" y="213">wizard 依据目标草拟 completion[] + boundaries[]，人增删改</text>

  <line x1="550" y1="224" x2="550" y2="249" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>

  <!-- S4 -->
  <rect class="sh" x="150" y="249" width="800" height="52" rx="8"/>
  <text class="tt" x="550" y="271">S4 人·设检查点（human）</text>
  <text class="ts" x="550" y="290">"哪些节点你必须亲眼看到？"→ checkpoints[]（默认：首个交付前 + 契约外动作前）</text>

  <line x1="550" y1="301" x2="550" y2="326" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>

  <!-- S5 -->
  <rect class="sh" x="150" y="326" width="800" height="52" rx="8"/>
  <text class="tt" x="550" y="348">S5 人·选介入等级（human，wizard 自动建议）</text>
  <text class="ts" x="550" y="367">依据完成标准可验证性/边界清晰度/影响面 → 建议 L0~L3，人确认或改</text>

  <line x1="550" y1="378" x2="550" y2="403" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 分支：agent 分解 -->
  <rect class="sg" x="150" y="403" width="380" height="58" rx="8"/>
  <text class="tt" x="340" y="425">S6 代理·分解 todo（auto/delegated）</text>
  <text class="ts" x="340" y="444">读契约 → 拆 P0/P1/P2 todo，每个带验收词</text>
  <rect class="sh" x="570" y="403" width="380" height="58" rx="8"/>
  <text class="tt" x="760" y="425">S6′ 人·审查 todo（human，L2 必审）</text>
  <text class="ts" x="760" y="444">L0/L1：代理先审，抽样给人；L2/L3：人逐条确认</text>

  <line x1="550" y1="461" x2="550" y2="486" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>

  <!-- S7 -->
  <rect class="sh" x="150" y="486" width="800" height="52" rx="8"/>
  <text class="tt" x="550" y="508">S7 人·最终确认（human gate）</text>
  <text class="ts" x="550" y="527">整份 Goal Contract 预览 → 人 approve / 修改 / 否决</text>

  <line x1="550" y1="538" x2="550" y2="563" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>

  <!-- S8 -->
  <rect class="sg" x="150" y="563" width="800" height="52" rx="8"/>
  <text class="tt" x="550" y="585">S8 落盘：Goal Contract → authority source + loopx registry + todos</text>
  <text class="ts" x="550" y="604">绑定执行通道（local / scheduled / remote）→ 目标进入执行态</text>

  <!-- 侧注 -->
  <text class="human" x="60" y="130">人</text>
  <text class="human" x="60" y="200">人</text>
  <text class="human" x="60" y="275">人</text>
  <text class="human" x="60" y="350">人</text>
  <text class="auto" x="60" y="435">代理</text>
  <text class="human" x="60" y="510">人</text>
  <text class="auto" x="60" y="590">机器</text>
</svg>
