<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .st { fill:#f6f8fa; stroke:#d0d7de; stroke-width:1.5; rx:10 }
      .sb { fill:#fff; stroke:#0969da; stroke-width:1.5; rx:8 }
      .tt { font-size:13px; fill:#1f2328; text-anchor:middle }
      .ts { font-size:11px; fill:#57606a; text-anchor:middle }
      .dec { font-size:11.5px; fill:#9a6700; text-anchor:middle; font-weight:bold }
    </style>
  </defs>

  <rect class="sb" x="350" y="20" width="400" height="50" rx="8"/>
  <text class="tt" x="550" y="49">有可执行 todo（agent 轮询 / 定时 / 手动）</text>

  <line x1="550" y1="70" x2="550" y2="100" stroke="#555" stroke-width="2" marker-end="url(#a4)"/>
  <rect class="st" x="250" y="100" width="600" height="46" rx="8"/>
  <text class="dec" x="550" y="128">决策：这个任务走哪个通道？</text>

  <!-- 三分支 -->
  <line x1="350" y1="146" x2="180" y2="200" stroke="#555" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="550" y1="146" x2="550" y2="200" stroke="#555" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="750" y1="146" x2="920" y2="200" stroke="#555" stroke-width="2" marker-end="url(#a4)"/>

  <rect class="sb" x="40" y="200" width="280" height="120" rx="8"/>
  <text class="tt" x="180" y="226">人在电脑前 / 交互</text>
  <text class="ts" x="180" y="248">→ local-loopx</text>
  <text class="ts" x="180" y="268">本机 agent 命令行认领</text>
  <text class="ts" x="180" y="288">结果写回同一 registry</text>

  <rect class="sb" x="410" y="200" width="280" height="120" rx="8"/>
  <text class="tt" x="550" y="226">定时 / 无人值守</text>
  <text class="ts" x="550" y="248">→ scheduled（watchdog）</text>
  <text class="ts" x="550" y="268">push intent → git 总线</text>
  <text class="ts" x="550" y="288">到点执行 · 断点续跑</text>

  <rect class="sb" x="780" y="200" width="280" height="120" rx="8"/>
  <text class="tt" x="920" y="226">本机忙 / 需并行 / 跨机资源</text>
  <text class="ts" x="920" y="248">→ remote（worker 池）</text>
  <text class="ts" x="920" y="268">查心跳找空闲 worker</text>
  <text class="ts" x="920" y="288">派发信封 → 执行 → 回传</text>

  <!-- 汇聚 -->
  <line x1="180" y1="320" x2="180" y2="370" stroke="#555" stroke-width="2"/>
  <line x1="550" y1="320" x2="550" y2="370" stroke="#555" stroke-width="2"/>
  <line x1="920" y1="320" x2="920" y2="370" stroke="#555" stroke-width="2"/>
  <line x1="180" y1="370" x2="920" y2="370" stroke="#555" stroke-width="2"/>
  <line x1="550" y1="370" x2="550" y2="400" stroke="#555" stroke-width="2" marker-end="url(#a4)"/>

  <rect class="sb" x="300" y="400" width="500" height="55" rx="8"/>
  <text class="tt" x="550" y="424">结果汇聚 → evidence 写回 loopx → refresh-state</text>
  <text class="ts" x="550" y="443">完成 / 失败 / 需要升级 → dashboard 统一可见</text>
</svg>
